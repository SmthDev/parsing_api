stages:
  - lint
  - build
  - deploy

variables:
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  DEPLOY_PATH: "/opt/parce"

.rules_mr_to_master:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'

.rules_build:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
    - if: '$CI_COMMIT_BRANCH == "master"'

.rules_master_push:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

default:
  image: golang:1.25
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends tesseract-ocr libtesseract-dev libleptonica-dev pkg-config
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .go/pkg/mod
      - .cache/go-build

lint:
  stage: lint
  extends: .rules_mr_to_master
  script:
    - go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
    - "$GOPATH/bin/golangci-lint run ./..."

build:
  stage: build
  extends: .rules_build
  script:
    - mkdir -p bin
    - go build -o bin/parce ./cmd/main.go
  artifacts:
    paths:
      - bin/parce
    expire_in: 1 hour

deploy:
  stage: deploy
  extends: .rules_master_push
  image: alpine:3.20
  needs:
    - build
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${DEPLOY_PATH}"
    - scp -P "${DEPLOY_PORT:-22}" bin/parce "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/parce.new"
    - scp -P "${DEPLOY_PORT:-22}" deploy/parce.service "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/parce.service"
    - ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "
        sudo mv /tmp/parce.service /etc/systemd/system/parce.service &&
        sudo mv ${DEPLOY_PATH}/parce.new ${DEPLOY_PATH}/parce &&
        sudo chmod +x ${DEPLOY_PATH}/parce &&
        sudo systemctl daemon-reload &&
        sudo systemctl enable --now parce.service &&
        sudo systemctl restart parce.service
      "
